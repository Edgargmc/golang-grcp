syntax = "proto3";

package todo;

option go_package = "./;todo";
option java_package = "com.edgargmc.grpctodo.proto";
option java_multiple_files = true;

// The Todo service definition
service TodoService {
  // Create a new todo item
  rpc CreateTodo (CreateTodoRequest) returns (CreateTodoResponse);
  
  // Get a todo item by ID
  rpc GetTodo (GetTodoRequest) returns (GetTodoResponse);
  
  // List all todo items
  rpc ListTodos (ListTodosRequest) returns (ListTodosResponse);
  
  // Update a todo item
  rpc UpdateTodo (UpdateTodoRequest) returns (UpdateTodoResponse);
  
  // Delete a todo item
  rpc DeleteTodo (DeleteTodoRequest) returns (DeleteTodoResponse);

  // Mark a todo item as completed
  rpc CompleteTodo (CompleteTodoRequest) returns (CompleteTodoResponse);

  // Stream events every time a todo is created, updated, completed or deleted
  rpc WatchTodos (WatchTodosRequest) returns (stream TodoEvent);

  // Bidirectional: client streams local changes, server streams back every
  // event (its own changes applied, plus everyone else's), on the same connection
  rpc SyncTodos (stream TodoChange) returns (stream TodoEvent);
}

// Request message for creating a todo
message CreateTodoRequest {
  string title = 1;
  string description = 2;
  bool completed = 3;
}

// Response message for creating a todo
message CreateTodoResponse {
  int32 id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  string created_at = 5;
}

// Request message for getting a todo
message GetTodoRequest {
  int32 id = 1;
}

// Response message for getting a todo
message GetTodoResponse {
  int32 id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  string created_at = 5;
}

// Request message for listing todos
message ListTodosRequest {
  int32 page = 1;
  int32 limit = 2;
}

// Response message for listing todos
message ListTodosResponse {
  repeated TodoItem todos = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// Request message for updating a todo
message UpdateTodoRequest {
  int32 id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
}

// Response message for updating a todo
message UpdateTodoResponse {
  int32 id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  string updated_at = 5;
}

// Request message for deleting a todo
message DeleteTodoRequest {
  int32 id = 1;
}

// Response message for deleting a todo
message DeleteTodoResponse {
  bool deleted = 1;
}

// Request message for completing a todo
message CompleteTodoRequest {
  int32 id = 1;
}

// Response message for completing a todo
message CompleteTodoResponse {
  int32 id = 1;
  bool completed = 2;
}

// Todo item message
message TodoItem {
  int32 id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  string created_at = 5;
}

// Request message for watching todo changes
message WatchTodosRequest {}

// Event emitted whenever a todo is created, updated, completed or deleted.
// Also used by SyncTodos to report back a rejected change: type = "error",
// todo unset, error = mensaje. WatchTodos nunca manda type = "error".
message TodoEvent {
  string type = 1; // "created" | "updated" | "completed" | "deleted" | "error"
  TodoItem todo = 2;
  string error = 3;
}

// One change sent by a SyncTodos client — exactly one of these per message
message TodoChange {
  oneof operation {
    CreateTodoRequest create = 1;
    UpdateTodoRequest update = 2;
    DeleteTodoRequest delete = 3;
  }
}